name: Daily Navy & ML Digest

on:
  schedule:
    - cron: "0 0 * * *"    # 00:00 UTC = 08:00 SGT every day
  workflow_dispatch: {}     # lets you manually trigger a run from the Actions tab

permissions:
  contents: write

concurrency:                # a /news burst won't start overlapping runs
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # 18 feeds x 12s worst case is ~3.6 min on its own
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"   # so print() shows up live in the Actions log
        run: python -u main.py

      - name: Commit updated state
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update seen-items state [skip ci]"
          git pull --rebase --autostash
          git push
